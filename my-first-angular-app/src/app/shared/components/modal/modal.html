<div
  #backdrop
  class="modal-backdrop"
  [class.modal-backdrop-side]="position() === 'side'"
  [class.modal-backdrop-float]="position() === 'float'"
  [class.hidden]="!open()"
  (click)="onBackdrop($event)"
>
  <div
    #dialog
    class="modal-dialog"
    [class.modal-sm]="size() === 'sm' && position() === 'center'"
    [class.modal-md]="size() === 'md' && position() === 'center'"
    [class.modal-lg]="size() === 'lg' && position() === 'center'"
    [class.modal-dialog-side]="position() === 'side'"
    [class.modal-dialog-float]="position() === 'float'"
    role="dialog"
    aria-modal="true"
    tabindex="-1"
    [attr.aria-labelledby]="title() ? titleId : null"
  >
    @if (title() || closable()) {
      <div class="modal-header">
        <div class="modal-header-text">
          @if (position() === 'float' && eyebrow()) {
            <span class="modal-eyebrow">{{ eyebrow() }}</span>
          }
          @if (title()) {
            <h2 [id]="titleId" class="modal-title">{{ title() }}</h2>
          }
        </div>
        @if (closable()) {
          <button
            type="button"
            class="modal-close-btn"
            aria-label="Close"
            (click)="close()"
          >
            &times;
          </button>
        }
      </div>
    }

    <div class="modal-body">
      <ng-content />
    </div>

    <div class="modal-footer">
      <ng-content select="[modal-footer]" />
    </div>
  </div>
</div>
