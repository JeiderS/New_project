<div class="cloudinary-upload">
  <div class="cloudinary-preview">
    @if (previewUrl()) {
      <img [src]="previewUrl()" alt="Vista previa de la imagen" />
    } @else {
      <div class="cloudinary-placeholder" aria-hidden="true">Sin imagen</div>
    }
  </div>

  <label class="cloudinary-input-label">
    <input
      type="file"
      accept="image/png,image/jpeg,image/jpg,image/webp"
      (change)="onFileSelected($event)"
    />
    <span>Elegir imagen</span>
  </label>
</div>
