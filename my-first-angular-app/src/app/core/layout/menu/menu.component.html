@if (item.children?.length) {

  <div class="node" (click)="toggle()">
    <i class="{{ item.icon }}"></i>
    <span>{{ item.nombre }}</span>
  </div>

  @if (expanded()) {

    <div class="children">
      @for (child of item.children; track child.nombre) {
        <app-menu [item]="child" (navigated)="onNavigate()"></app-menu>
      }
    </div>

  }

} @else if (item.route) {

  <a class="node leaf" [routerLink]="'/' + item.route" (click)="onNavigate()">
    <i class="{{ item.icon }}"></i>
    <span>{{ item.nombre }}</span>
  </a>

} @else {

  <div class="node inert">
    <i class="{{ item.icon }}"></i>
    <span>{{ item.nombre }}</span>
  </div>

}
