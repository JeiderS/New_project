<div class="app-shell">
  <aside class="app-sidebar">
    <div class="app-brand">
      <img src="https://tailwindcss.com/plus-assets/img/logos/mark.svg?color=teal&shade=700" alt="Mi Empresa" />
      <div>
        <p class="app-brand-title">Mi Empresa</p>
        <p class="app-brand-subtitle">Inventario multirubro</p>
      </div>
    </div>

    <nav class="app-nav">
      <a routerLink="/dashboard" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>
      <a routerLink="/products" routerLinkActive="is-active">Productos</a>
      <a routerLink="/admin" routerLinkActive="is-active">Administracion</a>
    </nav>

    <div class="app-profile">
      <div>
        <p class="app-user">Admin</p>
        <p class="app-role">Administrador</p>
      </div>
      <button (click)="signOut()" type="button">Salir</button>
    </div>
  </aside>

  <main class="app-content">
    <router-outlet></router-outlet>
  </main>
</div>
