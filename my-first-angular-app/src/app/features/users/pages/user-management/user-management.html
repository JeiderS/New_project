<app-page-layout class="data-pane" layout="split" [leftRatio]="50" [rightRatio]="50">
  <section layout-main class="grid-pane" aria-label="Usuarios registrados">
    <div class="pane-header">
      <div class="toolbar">
        <div class="search-field">
          <label for="users-search">Buscar</label>
          <input
            id="users-search"
            type="search"
            placeholder="Buscar por nombre o email"
            [value]="searchTerm()"
            (input)="onSearch($any($event.target).value)"
          />
        </div>

        <button type="button" class="btn btn-primary" (click)="openCreate()">Nuevo usuario</button>
      </div>

      <div class="toggle-row">
        <div class="toggle-field">
          <span>Mostrar inactivos</span>
          <span class="switch">
            <input
              type="checkbox"
              [checked]="showInactive()"
              (change)="onShowInactiveChange($any($event.target).checked)"
            />
            <span class="switch-track"></span>
          </span>
        </div>

        <span class="grid-total">Total: {{ visibleUsers().length }} usuarios</span>
      </div>
    </div>

    @if (hasRows()) {
      <app-grid
        class="app-grid"
        [rowData]="visibleUsers()"
        [columnDefs]="columnDefs"
        [defaultColDef]="defaultColDef"
        [gridOptions]="gridOptions"
        [rowSelection]="true"
        (cellClicked)="onCellClicked($event)"
      />
    } @else {
      <div class="users-empty" role="status" aria-live="polite">
        <h2>Sin resultados</h2>
        <p>
          {{
            loading()
              ? 'Cargando usuarios...'
              : 'No encontramos usuarios con ese criterio. Proba otro texto de busqueda.'
          }}
        </p>
      </div>
    }
  </section>

    <section layout-side class="user-form-pane">  
        <app-modal
    [(open)]="modalOpen"
    [title]="modalTitle()"
    [eyebrow]="modalEyebrow()"
    position="inline"
  >
    <form [formGroup]="userForm" class="user-form">
      @if (mode() === 'edit') {
        <div class="toggle-field">
          <span>Activo</span>
          <span class="switch">
            <input
              type="checkbox"
              [checked]="activeToggle()"
              (change)="onActiveToggleChange($any($event.target).checked)"
            />
            <span class="switch-track"></span>
          </span>
        </div>
      }

      <div class="field-group">
        <label for="user-email">Email</label>
        <input id="user-email" type="email" formControlName="email" autocomplete="email" />
      </div>

      @if (mode() === 'create') {
        <div class="field-group">
          <label for="user-password">Contrasena</label>
          <input
            id="user-password"
            type="password"
            formControlName="password"
            autocomplete="new-password"
          />
        </div>
      }

      <div class="field-row">
        <div class="field-group">
          <label for="user-first-name">Nombre</label>
          <input id="user-first-name" type="text" formControlName="firstName" />
        </div>
        <div class="field-group">
          <label for="user-last-name">Apellido</label>
          <input id="user-last-name" type="text" formControlName="lastName" />
        </div>
      </div>

      <div class="field-row">
        <div class="field-group">
          <label for="user-phone">Telefono</label>
          <input id="user-phone" type="tel" formControlName="phone" />
        </div>
        <div class="field-group">
          <label for="user-role">Rol</label>
          <select id="user-role" formControlName="roleId">
            <option [ngValue]="null">Sin rol</option>
            @for (role of roles(); track role.id) {
              <option [ngValue]="role.id">{{ role.name }}</option>
            }
          </select>
        </div>
      </div>
    </form>

    <div modal-footer>
      <button type="button" class="btn btn-ghost" (click)="modalOpen.set(false)">Cancelar</button>
      <button
        type="button"
        class="btn btn-primary"
        [disabled]="userForm.invalid"
        (click)="save()"
      >
        Guardar
      </button>
    </div>
  </app-modal>

    </section>
  </app-page-layout>
