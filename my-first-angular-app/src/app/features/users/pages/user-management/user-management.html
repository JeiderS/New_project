<div class="users-shell">
  <section class="users-card" aria-label="Usuarios registrados">
    <div class="users-toolbar">
      <div class="users-search">
        <label for="users-search">Buscar</label>
        <input
          id="users-search"
          type="search"
          placeholder="Buscar por nombre o email"
          [value]="searchTerm()"
          (input)="onSearch($any($event.target).value)"
        />
      </div>

      <button type="button" class="users-new-btn" (click)="openCreate()">Nuevo usuario</button>
    </div>

    @if (hasRows()) {
      <ag-grid-angular
        class="ag-theme-quartz users-grid"
        [rowData]="filteredUsers()"
        [columnDefs]="columnDefs"
        [defaultColDef]="defaultColDef"
        [gridOptions]="gridOptions"
        (cellClicked)="onCellClicked($event)"
      />
    } @else {
      <div class="users-empty" role="status" aria-live="polite">
        <h2>Sin resultados</h2>
        <p>
          {{
            loading()
              ? 'Cargando usuarios...'
              : 'No encontramos usuarios con ese criterio. Proba otro texto de busqueda.'
          }}
        </p>
      </div>
    }
  </section>
</div>

<app-modal [(open)]="modalOpen" [title]="modalTitle()" size="md">
  <form [formGroup]="userForm" class="user-form">
    <label for="user-email">Email</label>
    <input id="user-email" type="email" formControlName="email" autocomplete="email" />

    @if (mode() === 'create') {
      <label for="user-password">Contrasena</label>
      <input
        id="user-password"
        type="password"
        formControlName="password"
        autocomplete="new-password"
      />
    }

    <div class="user-form-row">
      <div>
        <label for="user-first-name">Nombre</label>
        <input id="user-first-name" type="text" formControlName="firstName" />
      </div>
      <div>
        <label for="user-last-name">Apellido</label>
        <input id="user-last-name" type="text" formControlName="lastName" />
      </div>
    </div>

    <label for="user-phone">Telefono</label>
    <input id="user-phone" type="tel" formControlName="phone" />

    <label for="user-address">Direccion</label>
    <input id="user-address" type="text" formControlName="address" />
  </form>

  <div modal-footer>
    @if (canDeactivate()) {
      <button type="button" class="user-btn-danger" [disabled]="saving()" (click)="deactivate()">
        Desactivar usuario
      </button>
    }
    <button type="button" class="user-btn-ghost" (click)="modalOpen.set(false)">Cancelar</button>
    <button
      type="button"
      class="user-btn-primary"
      [disabled]="userForm.invalid || saving()"
      (click)="save()"
    >
      {{ saving() ? 'Guardando...' : 'Guardar' }}
    </button>
  </div>
</app-modal>
